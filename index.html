<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ovrto</title>
<meta name="description" content="Over to you. Every task shows whose turn it is.">
<meta name="theme-color" content="#0D0D0F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ovrto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Ovrto — quiet, premium identity: Inter type, neutral greys, one accent. Sidebar + work area on desktop, bottom tabs on phone. */
:root{
  --bg:#F7F7F8;--surface:#FFFFFF;--sunk:#F0F0F2;--line:#E6E6EA;--line-strong:#CFCFD6;
  --fg:#0D0D10;--fg2:#3F3F46;--mute:#6B6B76;--on-accent:#FFFFFF;
  --red:#B42318;--amber:#8A5300;--green:#1E6B3A;
  --st-backlog:#5F686E;--st-unstarted:#4A5560;--st-started:#9A5B00;--st-review:#6A3FB5;--st-done:#1E6B3A;--st-canceled:#6B615C;
  --accent:#2A44B0;--accent-soft:#E8ECFB;
  --scrim:rgb(10 10 14/.38);
  --sh-drag:0 10px 24px -10px rgb(16 16 24/.22);--sh-pop:0 1px 2px rgb(16 16 24/.06),0 12px 32px -12px rgb(16 16 24/.22);--sh-sheet:0 -8px 32px -16px rgb(16 16 24/.28);
  --display:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --lift:0%;--sink:14%;--row:40px;--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D;--surface:#141417;--sunk:#0F0F12;--line:#25252B;--line-strong:#36363E;
  --fg:#F2F2F3;--fg2:#C4C4CB;--mute:#8E8E99;--on-accent:#0B0B0D;
  --red:#FF8A7A;--amber:#F2B547;--green:#5FCB8A;
  --st-backlog:#8E979C;--st-unstarted:#AAB5BD;--st-started:#F2A93B;--st-review:#B79AF2;--st-done:#5FCB8A;--st-canceled:#9C928C;
  --accent:#8FA3FF;--accent-soft:#1A2040;--scrim:rgb(0 0 0/.6);--lift:48%;--sink:0%;
  --sh-drag:0 6px 16px -6px rgb(0 0 0/.5);--sh-pop:0 8px 24px -8px rgb(0 0 0/.55);--sh-sheet:0 -8px 24px -12px rgb(0 0 0/.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0D;--surface:#141417;--sunk:#0F0F12;--line:#25252B;--line-strong:#36363E;
  --fg:#F2F2F3;--fg2:#C4C4CB;--mute:#8E8E99;--on-accent:#0B0B0D;
  --red:#FF8A7A;--amber:#F2B547;--green:#5FCB8A;
  --st-backlog:#8E979C;--st-unstarted:#AAB5BD;--st-started:#F2A93B;--st-review:#B79AF2;--st-done:#5FCB8A;--st-canceled:#9C928C;
  --accent:#8FA3FF;--accent-soft:#1A2040;--scrim:rgb(0 0 0/.6);--lift:48%;--sink:0%;
  --sh-drag:0 6px 16px -6px rgb(0 0 0/.5);--sh-pop:0 8px 24px -8px rgb(0 0 0/.55);--sh-sheet:0 -8px 24px -12px rgb(0 0 0/.6);color-scheme:dark}
/* workspace accents (light / dark) */
:root[data-accent="teal"]{--accent:#0B6B70;--accent-soft:#DDEFEE}
:root[data-accent="orange"]{--accent:#B54708;--accent-soft:#FBE8DA}
:root[data-accent="cobalt"]{--accent:#2A44B0;--accent-soft:#E1E6FA}
:root[data-accent="green"]{--accent:#2F6A2F;--accent-soft:#E2EFE0}
:root[data-accent="plum"]{--accent:#8A2C6E;--accent-soft:#F5E1EE}
:root[data-accent="graphite"]{--accent:#3A4652;--accent-soft:#E3E7EB}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-accent="teal"]{--accent:#4CC3BF;--accent-soft:#12302F}
  :root:not([data-theme="light"])[data-accent="orange"]{--accent:#FF9A52;--accent-soft:#3A2414}
  :root:not([data-theme="light"])[data-accent="cobalt"]{--accent:#8FA3FF;--accent-soft:#1C2342}
  :root:not([data-theme="light"])[data-accent="green"]{--accent:#7DCB6E;--accent-soft:#18301A}
  :root:not([data-theme="light"])[data-accent="plum"]{--accent:#F08ACB;--accent-soft:#36182C}
  :root:not([data-theme="light"])[data-accent="graphite"]{--accent:#AEB9C4;--accent-soft:#232A31}}
:root[data-theme="dark"][data-accent="teal"]{--accent:#4CC3BF;--accent-soft:#12302F}
:root[data-theme="dark"][data-accent="orange"]{--accent:#FF9A52;--accent-soft:#3A2414}
:root[data-theme="dark"][data-accent="cobalt"]{--accent:#8FA3FF;--accent-soft:#1C2342}
:root[data-theme="dark"][data-accent="green"]{--accent:#7DCB6E;--accent-soft:#18301A}
:root[data-theme="dark"][data-accent="plum"]{--accent:#F08ACB;--accent-soft:#36182C}
:root[data-theme="dark"][data-accent="graphite"]{--accent:#AEB9C4;--accent-soft:#232A31}
:root[data-density="compact"]{--row:32px}

*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 15px/1.47 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.mute{color:var(--mute)}.fg2{color:var(--fg2)}.sm{font-size:12.5px;line-height:16px}
.sp{flex:1}
.ico{display:inline-flex;flex:none;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font:500 10.5px var(--mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:0 4px;color:var(--fg2)}

/* ── shell ── */
.app{height:100%;display:grid;grid-template-columns:248px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:calc(12px + var(--sat)) 10px 12px max(10px,env(safe-area-inset-left,0px))}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.tabs{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px var(--gr) calc(4px + var(--sab)) var(--gl);z-index:6}
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand svg{color:var(--fg)}
.wordmark{display:inline-flex;color:var(--fg)}.wordmark svg{height:24px;width:auto}
.auth .wordmark svg{height:28px}
.auth .art .lab:has(.wordmark){opacity:1}
.brand b{font:650 17px/1 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wschip{margin-left:auto;font:600 10.5px var(--mono);border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px;color:var(--fg2);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.wschip:hover{border-color:var(--accent);color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;flex:1}
.nav h4{margin:14px 8px 4px;font:600 11px/16px var(--display);letter-spacing:-.005em;color:var(--mute);display:flex;align-items:center}
.nav h4 button{margin-left:auto;color:var(--mute);width:22px;height:22px;display:grid;place-items:center;border-radius:6px}
.nav h4 button:hover{background:var(--sunk);color:var(--fg)}
.navi{display:flex;align-items:center;gap:10px;padding:0 8px;height:34px;border-radius:8px;color:var(--fg2);font-weight:500;font-size:14px;text-align:left;width:100%;min-width:0}
.navi span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi:hover{background:var(--sunk);color:var(--fg)}
.navi[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.navi[aria-current="page"] .ico{color:var(--accent)}
.navi[aria-current="page"] .n{color:var(--fg2)}
.navi .n{font:500 11px var(--mono);color:var(--mute)}
.navi .badge{min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--red);color:#fff;font:600 10px/18px var(--mono);text-align:center}
.sidefoot{display:flex;align-items:center;gap:8px;padding:10px 8px 0;border-top:1px solid var(--line);margin-top:8px}
.sidefoot .who{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;color:var(--mute);font:600 10.5px var(--ui);position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:var(--red);color:#fff;font:600 9.5px/17px var(--mono);text-align:center}
.tab.plus .pl{width:44px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

/* ── header ── */
.head{display:flex;flex-direction:column;gap:10px;padding:calc(14px + var(--sat)) var(--gr) 12px var(--gl);border-bottom:1px solid var(--line);background:var(--surface)}
@media (min-width:821px){.head{padding-top:16px}}
.hrow{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.ptitle{font:650 26px/30px var(--display);letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px;min-width:0;text-align:left}
.ptitle .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.ptitle .chev{color:var(--mute)}
@media (max-width:820px){.ptitle{font-size:22px;line-height:26px}}
.hsub{color:var(--mute);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding-left:var(--gl);padding-right:var(--gr)}
.toolbar::-webkit-scrollbar{display:none}

/* ── controls ── */
.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;color:var(--fg)}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg2)}
.btn.ghost:hover:not(:disabled){background:var(--sunk);color:var(--fg)}
.btn.danger{color:var(--red)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn.lg{height:44px;font-size:15px;padding:0 18px}
.btn.wide{width:100%}
.btn.icon{width:34px;padding:0}
@media (max-width:820px){.btn{height:40px}.btn.sm{height:34px}.btn.icon{width:40px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{height:32px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:820px){.seg button{height:38px}}
.fchip{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 9px;font-size:12.5px;font-weight:600;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.fchip:hover{border-color:var(--line-strong);color:var(--fg)}
.fchip.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.fchip .x{color:var(--mute);margin-left:2px}
@media (max-width:820px){.fchip{height:36px}}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],input[type=time],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:14px;max-width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--line-strong);box-shadow:0 0 0 1.5px var(--accent)}
textarea{resize:vertical;line-height:1.55}
@media (max-width:820px){input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field>span.h{color:var(--mute);font-weight:500;font-size:12.5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:11px;background:var(--line-strong);transition:background .15s}
.switch i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--surface);top:3px;left:3px;transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(16px)}
.switch input:focus-visible+i{outline:1.5px solid var(--accent);outline-offset:2px}

/* ── signature: unit plate ── */
.plate{display:inline-flex;align-items:stretch;height:18px;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;font:500 10.5px/16px var(--mono);letter-spacing:0;flex:none;font-variant-numeric:tabular-nums}
.plate i{font-style:normal;padding:0 4px;background:var(--sunk);color:var(--mute);border-right:1px solid var(--line-strong)}
.plate b{font-weight:500;padding:0 5px;background:var(--surface);color:var(--fg)}
.plate.big{height:24px;font-size:12px;line-height:22px}
.plate.big b{color:var(--accent);font-weight:600}

/* ── signature: inspection-tag chips ── */
.tag{--c:var(--fg2);--cc:color-mix(in srgb,color-mix(in srgb,var(--c),#000 var(--sink)),#fff var(--lift));display:inline-flex;align-items:center;height:20px;padding:0 8px 0 14px;font:600 11.5px/20px var(--ui);color:var(--cc);background:color-mix(in srgb,var(--c) 16%,var(--surface));clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%,0 50%);position:relative;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:none}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:var(--bg)}
.tag.solid{background:var(--cc);color:var(--on-accent)}
:root[data-theme="dark"] .tag.solid{color:#0B0D0F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.solid{color:#0B0D0F}}
.tag.ghost{background:none;outline:1px dashed var(--line-strong);outline-offset:-1px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center;min-width:0}

/* ── signature: grid-bubble avatars ── */
.av{--ring:var(--line-strong);position:relative;width:24px;height:24px;flex:none;display:inline-grid;place-items:center}
.av .b{width:100%;height:100%;border-radius:50%;border:1.5px solid var(--ring);background:var(--surface);display:grid;place-items:center;overflow:hidden;font:600 9px/1 var(--mono);color:var(--fg2)}
.av .b img{width:100%;height:100%;object-fit:cover}
.av::after{content:"";position:absolute;left:50%;bottom:-4px;width:1.5px;height:4px;background:var(--ring);transform:translateX(-50%)}
.av.none .b{border-style:dashed;background:none}
.av.none::after{display:none}
.av.turn{--ring:var(--accent)}
.av.xs{width:20px;height:20px}.av.xs .b{font-size:8px}
.av.lg{width:32px;height:32px}.av.lg .b{font-size:11px}
.av.xl{width:64px;height:64px}.av.xl .b{font-size:20px;border-width:2px}.av.xl::after{height:6px;bottom:-6px;width:2px}
.turnline{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--mute);white-space:nowrap}
.turnline.me{color:var(--accent)}

/* ── board ── */
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.board{display:flex;gap:12px;align-items:flex-start;padding:14px var(--gr) 24px var(--gl);min-height:100%;width:max-content;min-width:100%}
.col{width:288px;flex:none;display:flex;flex-direction:column;min-height:120px}
@media (max-width:820px){.board{scroll-snap-type:x mandatory}.col{width:calc(100vw - 52px);scroll-snap-align:start}.scroll.hz{scroll-snap-type:x mandatory}}
.colhead{display:flex;align-items:center;gap:8px;height:32px;border-bottom:1px solid var(--line-strong);margin-bottom:8px;padding:0 2px}
.colhead .no{font:500 10.5px var(--mono);color:var(--mute);padding-right:8px;border-right:1px solid var(--line-strong);line-height:14px}
.colhead .nm{font:600 12.5px/16px var(--display);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .ct{margin-left:auto;font:500 11px var(--mono);color:var(--mute)}
.colhead .add{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--mute)}
.colhead .add:hover{background:var(--sunk);color:var(--fg)}
.cards{display:flex;flex-direction:column;gap:8px;min-height:60px;padding:2px;border-radius:8px}
.col.drop .cards{background:var(--accent-soft);outline:1.5px dashed var(--accent);outline-offset:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card:hover{border-color:var(--line-strong)}
.card.sel{outline:1.5px solid var(--accent);outline-offset:2px}
.card.dragging{box-shadow:var(--sh-drag);transform:translateY(-1px) rotate(.5deg);opacity:.92}
.card.ghosted{opacity:.35}
.card.regress{box-shadow:inset 3px 0 0 var(--red)}
.card .top{display:flex;align-items:center;gap:6px;min-width:0}
.card .t{font:600 15px/20px var(--ui);overflow-wrap:anywhere;color:var(--fg)}
.card.closed .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.card .foot{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.meta{font:500 11px var(--mono);color:var(--mute);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.meta.red{color:var(--red)}
.colempty{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font:500 10.5px var(--mono);color:var(--mute);letter-spacing:0;}

/* ── list ── */
.list{padding:8px var(--gr) 40px var(--gl)}
.group{margin-bottom:18px}
.ghead{display:flex;align-items:center;gap:8px;height:32px;border-bottom:1px solid var(--line-strong);padding:0 2px;position:sticky;top:0;background:var(--bg);z-index:1}
.ghead .no{font:500 10.5px var(--mono);color:var(--mute);padding-right:8px;border-right:1px solid var(--line-strong);line-height:14px}
.ghead .nm{font:600 12.5px/16px var(--display);letter-spacing:-.005em}
.ghead .ct{margin-left:auto;font:500 11px var(--mono);color:var(--mute)}
.ghead .extra{font:500 11px var(--mono);color:var(--mute);white-space:nowrap}

/* ── empty (dimensioned frame on dot grid) ── */

/* ── turn / review / myturn ── */

.sechead{display:flex;align-items:baseline;gap:10px;margin:6px 0 8px}

.stat{display:flex;gap:18px;flex-wrap:wrap;align-items:center}

.deckbtns{display:flex;gap:10px;justify-content:center;padding:16px var(--gr) 8px var(--gl)}

/* ── sheets / drawers / popovers ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--surface);display:flex;flex-direction:column;min-height:0;box-shadow:var(--sh-pop)}

.sheet.center{left:50%;top:max(7vh,calc(var(--sat) + 12px));transform:translateX(-50%);width:min(640px,calc(100vw - 24px));max-height:86vh;border:1px solid var(--line-strong);border-radius:14px;overflow:hidden}
@media (max-width:820px){
  .sheet.right,.sheet.center{left:0;right:0;bottom:0;top:auto;width:100%;max-height:calc(100% - var(--sat) - 8px);height:auto;transform:none;border-radius:14px 8px 0 0;border:0;border-top:1px solid var(--line-strong);box-shadow:var(--sh-sheet);padding-bottom:var(--sab)}
  .sheet.full{height:calc(100% - var(--sat) - 8px)}

}
.sheet .grab{display:none;width:36px;height:4px;border-radius:6px;background:var(--line-strong);margin:8px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:52px;flex:none}

.sbody{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}

.x{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--fg2);flex:none}

@media (max-width:820px){.x{width:40px;height:40px}}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh-pop);width:280px;max-width:calc(100vw - 16px);max-height:min(420px,70vh);display:flex;flex-direction:column;overflow:hidden}
.pop .q{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 12px;width:100%;box-shadow:none!important}

.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0 10px;min-height:36px;border-radius:6px;font-size:14px}

.opt .ck{margin-left:auto;color:var(--accent);visibility:hidden}

.opt .sub{color:var(--mute);font-size:12px;margin-left:auto}
.opt.danger{color:var(--red)}
.pop .hint{padding:8px 12px;color:var(--mute);font-size:12.5px}

.pop .ph{padding:8px 12px 4px;font:600 10.5px var(--display);letter-spacing:-.005em;color:var(--mute)}
@media (max-width:820px){.opt{min-height:44px}}

/* ── task detail ── */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 260px;flex:1;min-height:0}

@media (max-width:820px){.detail{display:flex;flex-direction:column;overflow-y:auto}.detail .mainc{overflow:visible;padding:14px 16px 24px}.detail .rail{border-left:0;border-top:1px solid var(--line);overflow:visible}}
.ttl{font:700 22px/28px var(--ui);border:0;background:none;padding:2px 0;width:100%;resize:none;letter-spacing:-.01em;overflow:hidden}

.sentence{font-size:16px;line-height:30px;color:var(--fg2)}

.turnstrip{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);flex-wrap:wrap}

.block{border-top:1px solid var(--line);padding-top:12px}
.block>h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:600 12px/16px var(--display);letter-spacing:-.005em;color:var(--fg2)}
.block>h4 button.tg{display:inline-flex;gap:6px;align-items:center}
.block>h4 .act{margin-left:auto;display:flex;gap:4px;text-transform:none;letter-spacing:0;font-family:var(--ui)}
.md{font-size:15px;line-height:1.6;overflow-wrap:anywhere;color:var(--fg)}
.md p{margin:0 0 8px}.md ul,.md ol{margin:0 0 8px;padding-left:20px}.md code{font:12.5px var(--mono);background:var(--sunk);padding:1px 4px;border-radius:6px}

.addsec{display:flex;flex-wrap:wrap;gap:6px}

/* ── settings ── */
.setwrap{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1;min-height:0}

@media (max-width:820px){.setwrap{display:flex;flex-direction:column}.setnav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;flex:none;scrollbar-width:none}.setnav button{flex:none}.setbody{padding:16px 16px 32px}}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.panel>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.preview{border:1px dashed var(--line-strong);border-radius:8px;padding:14px;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/12px 12px}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{font-size:12.5px;color:var(--mute);margin:0}

/* ── inbox ── */
.inrow{display:flex;gap:12px;align-items:flex-start;padding:12px 10px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:var(--bg);position:relative;touch-action:pan-y}

/* ── toast / offline pill ── */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}

/* ── cmd-k ── */

/* ── auth ── */
.auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}

const tours = (() => {

    document.body.append(mask, hole, bub); els = [mask, hole, bub];

/* ── word diff for the review screen ── */
function wordDiff(a, b) {
  const A = String(a ?? '').split(/(\s+)/), B = String(b ?? '').split(/(\s+)/);
  if (A.length * B.length > 40000) return [h('del', { text: a }), ' ', h('ins', { text: b })];
  const dp = Array.from({ length: A.length + 1 }, () => new Uint16Array(B.length + 1));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (cls, t) => { const last = out[out.length - 1]; if (last && last.cls === cls) last.t += t; else out.push({ cls, t }); };
  while (i < A.length && j < B.length) { if (A[i] === B[j]) { push('', A[i]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { push('del', A[i]); i++; } else { push('ins', B[j]); j++; } }
  while (i < A.length) push('del', A[i++]); while (j < B.length) push('ins', B[j++]);
  return out.map(x => (x.cls ? h(x.cls, { text: x.t }) : x.t));
}
