*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;text-align:start;width:100%;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation}@media (hover:hover){.card:hover{border-color:var(--line-strong)}}
.card.sel{outline:1.5px solid var(--accent);outline-offset:2px}
.card.dragging{box-shadow:var(--sh-drag);transform:translateY(-1px) rotate(.5deg);opacity:.92}
.card.ghosted{opacity:.35}
.card.regress{box-shadow:inset 3px 0 0 var(--red)}
.card .top{display:flex;align-items:center;gap:6px;min-width:0}
.card .t{font:600 15px/20px var(--ui);overflow-wrap:anywhere;color:var(--fg)}
.card.closed .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.card .foot{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.meta{font:500 11px var(--mono);color:var(--mute);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.meta.red{color:var(--red)}
.colempty{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font:500 10.5px var(--mono);color:var(--mute);letter-spacing:0;}

/* ── list ── */
.list{padding:8px var(--gr) 40px var(--gl)}
.group{margin-bottom:18px}
.ghead{display:flex;align-items:center;gap:8px;height:32px;border-bottom:1px solid var(--line-strong);padding:0 2px;position:sticky;top:0;background:var(--bg);z-index:1}
.ghead .no{font:500 10.5px var(--mono);color:var(--mute);padding-inline-end:8px;border-inline-end:1px solid var(--line-strong);line-height:14px}
.ghead .nm{font:600 12.5px/16px var(--display);letter-spacing:-.005em}
.ghead .ct{margin-inline-start:auto;font:500 11px var(--mono);color:var(--mute)}
.ghead .extra{font:500 11px var(--mono);color:var(--mute);white-space:nowrap}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:var(--row);padding:4px 6px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:none}@media (hover:hover){.row:hover{background:var(--surface)}}
.row.sel{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row.closed .t{color:var(--mute)}
.row .r{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
.row.regress{box-shadow:inset 3px 0 0 var(--red)}
@media (max-width:820px){.row{grid-template-columns:auto minmax(0,1fr) auto;padding:8px 4px;min-height:52px}.row .plate{display:none}.row .r .tag,.row .r .cols{display:none}}
.tbl{overflow-x:auto;padding:0 var(--gr) 40px var(--gl)}
.tbl table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--bg);text-align:start;font:600 11px/16px var(--display);letter-spacing:-.005em;color:var(--mute);padding:10px 12px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap;z-index:1}
.tbl td{padding:0 12px;height:var(--row);border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.trow{cursor:pointer}@media (hover:hover){.tbl tr.trow:hover td{background:var(--surface)}}
.tbl tr.gh td{background:var(--sunk);font:600 11.5px var(--display);letter-spacing:-.005em;height:30px}

/* ── empty (dimensioned frame on dot grid) ── */
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:48px 16px;max-width:420px;margin:0 auto}
.empty .frame{width:160px;height:96px;border:1px dashed var(--line-strong);border-radius:6px;display:grid;place-items:center;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/12px 12px;font:500 11px var(--mono);letter-spacing:0;color:var(--mute);}
.empty p{margin:0;font-size:15px;color:var(--fg2);text-wrap:balance}

/* ── turn / review / myturn ── */
.section{padding:14px var(--gr) 8px var(--gl)}
.sechead{display:flex;align-items:baseline;gap:10px;margin:6px 0 8px}
.sechead h3{margin:0;font:600 13px/16px var(--display);letter-spacing:-.005em}
.sechead .ct{font:500 11px var(--mono);color:var(--mute)}
.stat{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.stat .k{font:500 10.5px var(--mono);color:var(--mute);letter-spacing:0}
.stat .v{font:650 22px/26px var(--display);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;min-width:160px;flex:1}
.bar i{display:block;height:100%}
.deck{position:relative;height:min(62vh,520px);margin:12px auto 0;max-width:520px;padding:0 var(--gr) 0 var(--gl)}
.dcard{position:absolute;inset:0 var(--gr) 0 var(--gl);background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;touch-action:pan-y;will-change:transform}
.dcard.under{transform:translateY(10px) scale(.96);opacity:.7;pointer-events:none}
.dcard.under2{transform:translateY(20px) scale(.92);opacity:.4;pointer-events:none}
.dcard .stamp{position:absolute;top:18px;padding:4px 10px;border:2px solid currentColor;border-radius:6px;font:650 16px var(--display);letter-spacing:0;opacity:0;transform:rotate(-8deg)}
.dcard .stamp.pass{inset-inline-end:18px;color:var(--green)}
.dcard .stamp.back{inset-inline-start:18px;color:var(--red);transform:rotate(8deg)}
.dcard .body{flex:1;min-height:0;overflow:auto;color:var(--fg2);font-size:14.5px}
.deckbtns{display:flex;gap:10px;justify-content:center;padding:16px var(--gr) 8px var(--gl)}

/* ── sheets / drawers / popovers ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--surface);display:flex;flex-direction:column;min-height:0;box-shadow:var(--sh-pop)}
.sheet.right{top:0;inset-inline-end:0;bottom:0;width:min(760px,100vw);border-inline-start:1px solid var(--line);padding-top:var(--sat);padding-bottom:var(--sab);padding-inline-end:env(safe-area-inset-right,0px)}
.sheet.center{left:50%;top:max(7vh,calc(var(--sat) + 12px));transform:translateX(-50%);width:min(640px,calc(100vw - 24px));max-height:86vh;border:1px solid var(--line-strong);border-radius:14px;overflow:hidden}
@media (max-width:820px){
  .sheet.right,.sheet.center{inset-inline-start:0;inset-inline-end:0;bottom:0;top:auto;width:100%;max-height:calc(100% - var(--sat) - 8px);height:auto;transform:none;border-radius:14px 8px 0 0;border:0;border-top:1px solid var(--line-strong);box-shadow:var(--sh-sheet);padding-bottom:var(--sab)}
  .sheet.full{height:calc(100% - var(--sat) - 8px)}
  .sheet .grab{display:block}
}
.sheet .grab{display:none;width:36px;height:4px;border-radius:6px;background:var(--line-strong);margin:8px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:52px;flex:none}
.shead h2{margin:0;font:650 16px/20px var(--display);letter-spacing:-.005em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sbody>*,.setbody>*,.detail .mainc>*,.detail .rail>*{flex:none}
.sfoot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;flex:none}
.x{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--fg2);flex:none}@media (hover:hover){.x:hover{background:var(--sunk);color:var(--fg)}}
@media (max-width:820px){.x{width:40px;height:40px}}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh-pop);width:280px;max-width:calc(100vw - 16px);max-height:min(420px,70vh);display:flex;flex-direction:column;overflow:hidden}
.pop .q{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 12px;width:100%;box-shadow:none!important}
.pop .opts{overflow-y:auto;padding:4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:0 10px;min-height:36px;border-radius:6px;font-size:14px}
.opt:hover,.opt.act{background:var(--sunk)}
.opt .ck{margin-inline-start:auto;color:var(--accent);visibility:hidden}
.opt[aria-selected="true"] .ck{visibility:visible}
.opt .sub{color:var(--mute);font-size:12px;margin-inline-start:auto}
.opt.danger{color:var(--red)}
.pop .hint{padding:8px 12px;color:var(--mute);font-size:12.5px}
.pop .sep{height:1px;background:var(--line);margin:4px 0}
.pop .ph{padding:8px 12px 4px;font:600 10.5px var(--display);letter-spacing:-.005em;color:var(--mute)}
@media (max-width:820px){.opt{min-height:44px}}

/* ── task detail ── */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 260px;flex:1;min-height:0}
.detail .mainc{overflow-y:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.detail .rail{border-inline-start:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
@media (max-width:820px){.detail{display:flex;flex-direction:column;overflow-y:auto}.detail .mainc{overflow:visible;padding:14px 16px 24px}.detail .rail{border-inline-start:0;border-top:1px solid var(--line);overflow:visible}}
.ttl{font:700 22px/28px var(--ui);border:0;background:none;padding:2px 0;width:100%;resize:none;letter-spacing:-.01em;overflow:hidden}
.ttl:focus{box-shadow:none;border:0}
.sentence{font-size:16px;line-height:30px;color:var(--fg2)}
.sentence button.w{font-weight:700;color:var(--fg);border-bottom:1.5px dotted var(--line-strong);padding:0 1px;line-height:24px}@media (hover:hover){.sentence button.w:hover{border-bottom-color:var(--accent);color:var(--accent)}}
.sentence button.w.blank{color:var(--mute);font-weight:500}
.turnstrip{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);flex-wrap:wrap}
.turnstrip .who{display:flex;flex-direction:column;min-width:0;flex:1}
.turnstrip .who b{font-size:14px}
.turnstrip .who span{font:500 11px var(--mono);color:var(--mute)}
.block{border-top:1px solid var(--line);padding-top:12px}
.block>h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:600 12px/16px var(--display);letter-spacing:-.005em;color:var(--fg2)}
.block>h4 button.tg{display:inline-flex;gap:6px;align-items:center}
.block>h4 .act{margin-inline-start:auto;display:flex;gap:4px;text-transform:none;letter-spacing:0;font-family:var(--ui)}
.md{font-size:15px;line-height:1.6;overflow-wrap:anywhere;color:var(--fg)}
.md p{margin:0 0 8px}.md ul,.md ol{margin:0 0 8px;padding-inline-start:20px}.md code{font:12.5px var(--mono);background:var(--sunk);padding:1px 4px;border-radius:6px}
.md:empty::before{content:attr(data-ph);color:var(--mute)}
.mdbox{cursor:text;border-radius:6px;padding:4px 6px;margin:-4px -6px;min-height:28px}@media (hover:hover){.mdbox:hover{background:var(--sunk)}}
.addsec{display:flex;flex-wrap:wrap;gap:6px}
.ck-item{display:flex;align-items:center;gap:10px;min-height:36px}
.ck-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.ck-item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ck-item.done .tx{color:var(--mute);text-decoration:line-through}
.ck-item .del{opacity:0}
.ck-item:hover .del,.ck-item:focus-within .del{opacity:1}
@media (hover:none){.ck-item .del{opacity:1}}
.prog{font:500 11px var(--mono);color:var(--mute)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;align-items:center}
.kv>label{font-size:12.5px;color:var(--mute);font-weight:500}
.kv .val{min-width:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:30px}
.kv .val>button.pick{display:inline-flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;min-height:30px;font-size:13.5px;font-weight:600;max-width:100%;text-align:start}@media (hover:hover){.kv .val>button.pick:hover{background:var(--sunk)}}
.kv .val>button.pick.blank{color:var(--mute);font-weight:500}
.timeline{display:flex;flex-direction:column;gap:2px}
.ev{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.ev .b{flex:1;min-width:0}
.ev .who{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev .who time{font:500 10.5px var(--mono);color:var(--mute)}
.ev .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.ev.small{padding:3px 0 3px 34px;color:var(--mute);font-size:12.5px}
.ev.small b{color:var(--fg2);font-weight:600}
.ev .handoff{font:600 10px var(--mono);color:var(--accent);letter-spacing:0}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.composer textarea{min-height:72px;width:100%}

/* ── settings ── */
.setwrap{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1;min-height:0}
.setnav{border-inline-end:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;background:var(--bg)}
.setnav button{text-align:start;padding:0 10px;height:36px;border-radius:8px;font-weight:600;color:var(--fg2);font-size:14px}
.setnav button[aria-current="true"]{background:var(--accent-soft);color:var(--fg)}
.setbody{overflow-y:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:820px){.setwrap{display:flex;flex-direction:column}.setnav{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px;flex:none;scrollbar-width:none}.setnav button{flex:none}.setbody{padding:16px 16px 32px}}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.panel>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h3{margin:0;font:600 12.5px/16px var(--display);letter-spacing:-.005em;flex:1;min-width:120px}
.panel>.pbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);min-height:48px;flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .nm{flex:1 1 140px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.prow .sub{color:var(--mute);font-size:12px;font-weight:500}
.prow .used{font:500 10.5px var(--mono);color:var(--mute);white-space:nowrap}
.drag{cursor:grab;color:var(--mute);width:22px;display:grid;place-items:center;touch-action:none}
.swatch{width:20px;height:20px;border-radius:6px;border:1px solid var(--line-strong);flex:none;padding:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);position:relative}
.swatches button[aria-pressed="true"]{outline:1.5px solid var(--fg);outline-offset:2px}
.preview{border:1px dashed var(--line-strong);border-radius:8px;padding:14px;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/12px 12px}
.preview .lbl{font:500 10px var(--mono);letter-spacing:0;color:var(--mute);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{font-size:12.5px;color:var(--mute);margin:0}

/* ── inbox ── */
.inrow{display:flex;gap:12px;align-items:flex-start;padding:12px 10px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:var(--bg);position:relative;touch-action:pan-y}@media (hover:hover){.inrow:hover{background:var(--surface)}}
.inrow.unread{background:var(--surface)}
.inrow.unread::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:2px;background:var(--accent)}
.inrow .b{flex:1;min-width:0}
.inrow .ln1{display:flex;gap:8px;align-items:center;min-width:0}
.inrow .ln1 .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.inrow .ln2{color:var(--fg2);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.reason{font:600 10px var(--mono);letter-spacing:0;padding:1px 5px;border-radius:6px;border:1px solid currentColor;flex:none}
.reason.turn{color:var(--accent)}.reason.mention{color:var(--st-review)}.reason.updated,.reason.fyi{color:var(--mute)}
.swipebg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:600 12px var(--display);letter-spacing:0;color:#fff}
.swipewrap{position:relative;overflow:hidden}

/* ── toast / offline pill ── */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
@media (max-width:820px){.toasts{bottom:calc(76px + var(--sab))}}
.toast{background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;box-shadow:var(--sh-pop);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.4)}
:root[data-theme="dark"] .toast button{filter:none;color:var(--accent-soft)}
.pill{position:fixed;top:calc(8px + var(--sat));left:50%;transform:translateX(-50%);z-index:70;background:var(--amber);color:#fff;font:600 12px var(--ui);padding:5px 12px;border-radius:999px;box-shadow:var(--sh-pop)}

/* ── tour ── */
.tourmask{position:fixed;inset:0;z-index:90;pointer-events:auto}
.tourhole{position:fixed;z-index:91;border-radius:8px;box-shadow:0 0 0 9999px rgb(0 0 0/.45);pointer-events:none;transition:all .25s ease}
.tourhole::before,.tourhole::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--accent)}
.tourhole::before{inset-inline-start:-5px;top:-5px;border-inline-end:0;border-bottom:0}
.tourhole::after{inset-inline-end:-5px;bottom:-5px;border-inline-start:0;border-top:0}
.tourbub{position:fixed;z-index:92;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:14px;box-shadow:var(--sh-pop);display:flex;flex-direction:column;gap:8px}
.tourbub .k{font:500 10.5px var(--mono);color:var(--mute)}
.tourbub h5{margin:0;font:600 16px/20px var(--ui)}
.tourbub p{margin:0;color:var(--fg2);font-size:14px}
.tourbub .row2{display:flex;gap:8px;align-items:center;margin-top:4px}
@media (prefers-reduced-motion:reduce){.tourhole{transition:opacity .2s}*{animation:none!important;transition-duration:0s!important}}

/* ── cmd-k ── */
.cmdk{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));z-index:61;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--sh-pop);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.cmdk input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px;font-size:16px;box-shadow:none!important}
.cmdk .opts{overflow-y:auto;padding:6px}

/* ── auth ── */
/* sign in: one centred column, always dark — the moving logo on top, the form under it */
.auth{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;padding:calc(48px + var(--sat)) var(--gr) calc(48px + var(--sab)) var(--gl);
  --bg:#0B0B0D;--surface:#141418;--sunk:#0F0F12;--line:#25252B;--line-strong:#34343C;--fg:#F4F4F2;--fg2:#C4C4CB;--mute:#A1A1A8;--on-accent:#0B0B0D;
  --red:#FF8A7A;--green:#5FCB8A;--accent:#8FA3FF;--accent-soft:#1C2342;color-scheme:dark;background:var(--bg);color:var(--fg)}
.auth .art{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.auth .art::before{content:"";position:absolute;left:50%;top:50%;width:460px;height:340px;margin:-170px 0 0 -230px;background:radial-gradient(closest-side,rgb(42 68 176/.42),transparent);pointer-events:none}
.auth .art.play::before{animation:wm-glow .7s ease .6s both}
.auth .art>*{position:relative}
.intro-wm{width:clamp(168px,44vw,196px)}
.intro-custom{display:flex;align-items:center;gap:12px}.intro-mark{width:46px}
.intro-name{font:650 30px/1 var(--display);letter-spacing:-.03em}
.intro-tag{font:500 15px var(--ui);letter-spacing:-.01em;color:var(--mute)}
.auth .form{width:min(380px,100%)}
.auth form{width:100%;display:flex;flex-direction:column;gap:14px}
.auth h1{margin:0;font:650 30px/34px var(--display);letter-spacing:-.01em;text-align:center}
.auth p.sub{margin:-4px 0 4px;color:var(--mute);text-align:center}
.auth .links{flex-direction:column;align-items:center;gap:14px;margin-top:4px}
.auth .link{font-size:14px}
.auth input{padding:11px 12px;font-size:16px}
.err{border-inline-start:3px solid var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface));color:var(--fg);padding:9px 12px;font-size:13.5px;border-radius:6px}
.info{border-inline-start:3px solid var(--accent);background:var(--accent-soft);color:var(--fg);padding:9px 12px;font-size:13.5px;border-radius:6px}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{color:var(--accent);font-weight:600;font-size:13.5px}@media (hover:hover){.link:hover{text-decoration:underline}}
/* loading: the t keeps passing it on (shows only if loading takes a moment) */
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--fg);animation:wm-fade .3s ease .35s both}
.boot-mark{width:64px}
.boot-cap{font:500 13px var(--ui);color:var(--mute)}
/* every other wait: the same moving mark, small, next to what's happening */
.ld{display:inline-flex;align-items:center;gap:8px;min-width:0}
.ld-mark{display:inline-block;width:1.6em;flex:none;line-height:0}
.ld-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ld-row{display:flex;align-items:center;justify-content:center;padding:18px 0;color:var(--mute);font-size:13.5px}
.ld-row .ld-mark{width:26px;color:var(--fg)}
.btn[aria-busy]{cursor:progress;opacity:1}
.btn.pri .ld-mark,.toast .ld-mark,.pill .ld-mark{--accent:currentColor}
.toast .ld{gap:10px}
.pill{display:flex;align-items:center;gap:6px}.pill .ld-mark{width:18px}
.imp-busy .ld-mark{color:var(--fg)}
.imp-reading{display:flex;justify-content:center}.imp-reading .ld-mark{width:30px}
/* opening screen (signed-in launches): the wordmark plays once in the middle, then fades into the app */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);color:var(--fg);pointer-events:none;transition:opacity .35s ease;--glow:color-mix(in srgb,var(--accent) 10%,transparent)}
:root[data-theme="dark"] #splash{--glow:color-mix(in srgb,var(--accent) 24%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash{--glow:color-mix(in srgb,var(--accent) 24%,transparent)}}
#splash.out{opacity:0}
#splash .sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
#splash .sp-in>*{position:relative}
#splash .sp-glow{position:absolute;left:50%;top:50%;width:520px;height:420px;margin:-210px 0 0 -260px;background:radial-gradient(closest-side,var(--glow),transparent);animation:wm-glow .7s ease .6s both}
#splash .sp-logo{width:210px}
#splash .sp-mark{width:72px}
/* the logo in motion: letters rise, the t's cross becomes an arrow and passes it on to the o */
.wm-anim,.mark-anim{display:block;width:100%;height:auto;overflow:visible}
.wm-anim .wm-l path,.mark-anim .mk-t path{fill:currentColor}
.wm-anim .wm-x,.wm-anim .wm-o path,.wm-anim .wm-dot,.mark-anim .mk-x{fill:var(--accent)}
.wm-anim .wm-ring{fill:none;stroke:var(--accent);stroke-width:18px;opacity:0}
.wm-anim>*,.mark-anim .mk-t,.mark-anim .mk-x,.mark-anim .mk-chev{transform-box:fill-box;transform-origin:center}
.wm-anim .wm-x,.mark-anim .mk-x{transform-origin:left center}
.play .wm-anim .wm-l{animation:wm-rise .5s cubic-bezier(.2,.8,.2,1) both}
.play .wm-anim .wm-l2{animation-delay:.06s}.play .wm-anim .wm-l3{animation-delay:.12s}.play .wm-anim .wm-l4{animation-delay:.18s}
.play .wm-anim .wm-x{animation:wm-bar .32s cubic-bezier(.6,0,.2,1) .42s both}
.play .wm-anim .wm-chev{animation:wm-chev .26s cubic-bezier(.2,.8,.2,1) .62s both}
.play .wm-anim .wm-o{animation:wm-catch .42s cubic-bezier(.3,1.4,.5,1) .72s both}
.play .wm-anim .wm-dot{animation:wm-dot .34s cubic-bezier(.3,1.6,.5,1) .86s both}
.play .wm-anim .wm-ring{animation:wm-ring .75s ease-out .82s both}
.play .intro-tag{animation:wm-fade .45s ease 1s both}
.play .intro-name{animation:wm-fade .4s ease .55s both}
.play .mark-anim .mk-t{animation:mk-rise .45s cubic-bezier(.2,.8,.2,1) both}
.play .mark-anim .mk-x{animation:wm-bar .32s cubic-bezier(.6,0,.2,1) .3s both}
.play .mark-anim .mk-chev{animation:mk-chev .3s cubic-bezier(.2,.8,.2,1) .5s both}
.loop .mark-anim .mk-x{animation:ld-bar 1.8s cubic-bezier(.6,0,.2,1) infinite}
.loop .mark-anim .mk-chev{animation:ld-chev 1.8s cubic-bezier(.4,0,.2,1) infinite}
@keyframes wm-rise{from{opacity:0;transform:translateY(220px)}}
@keyframes wm-bar{from{transform:scaleX(0)}}
@keyframes wm-chev{from{opacity:0;transform:translateX(-220px)}}
@keyframes wm-catch{from{opacity:0;transform:scale(.2)}}
@keyframes wm-dot{from{transform:scale(0)}}
@keyframes wm-ring{0%{opacity:0;transform:scale(.9)}12%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@keyframes wm-fade{from{opacity:0;transform:translateY(8px)}}
@keyframes wm-glow{from{opacity:0;transform:scale(.7)}}
@keyframes mk-rise{from{opacity:0;transform:translateY(300px)}}
@keyframes mk-chev{from{opacity:0;transform:translateX(-400px)}}
@keyframes ld-bar{0%{transform:scaleX(0);opacity:1}40%,72%{transform:scaleX(1);opacity:1}92%,100%{transform:translateX(200px) scaleX(1);opacity:0}}
@keyframes ld-chev{0%,22%{opacity:0;transform:translateX(-340px)}44%,72%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateX(200px)}}

/* ── import ── */

.ring-who{font:650 26px/1.2 var(--display);letter-spacing:-.02em}

@keyframes ringglow{0%{box-shadow:0 0 0 0 rgb(48 164 108/.6),0 10px 30px rgb(0 0 0/.35)}100%{box-shadow:0 0 0 22px rgb(48 164 108/0),0 10px 30px rgb(0 0 0/.35)}}

/* ── AI write-up & voice notes ── */
.ai-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ai-note{flex-basis:100%;font-size:13px;color:var(--fg2);background:var(--accent-soft);border-radius:8px;padding:8px 10px;line-height:1.45}
.rec{align-items:center;text-align:center;gap:14px;padding-top:18px}

.rec-bars{display:flex;align-items:center;gap:3px;height:56px}

/* ── insights ── */
.ins{display:flex;flex-direction:column;gap:16px;padding:16px var(--gr) 32px var(--gl);max-width:980px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.kpi{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.kpi b{font:650 26px/1.1 var(--display);letter-spacing:-.02em}.kpi>span:not(.sm){font-weight:600;font-size:13.5px}
.ins-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}

/* ── client status page ── */
.cp{min-height:100%;background:var(--bg);padding:calc(28px + var(--sat)) var(--gr) 48px var(--gl)}
.cp-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.cp h1{margin:0;font:650 34px/1.15 var(--display);letter-spacing:-.025em}
.cp-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
@media (max-width:560px){.cp-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cp-n{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column}
.cp-n b{font:650 24px/1.1 var(--display)}.cp-n span{font-size:12.5px;color:var(--fg2);font-weight:600}
.cp-n.waiting b{color:var(--amber)}.cp-n.done b{color:var(--green)}
.cp-prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.cp-prog i{display:block;height:100%;background:var(--green);border-radius:4px}
.cp-g{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin-top:6px}

.cp-t{display:flex;flex-direction:column;gap:2px;min-width:0}.cp-t b{font-size:15px;overflow-wrap:anywhere}
.cp-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--st-unstarted)}
.cp-dot.started{background:var(--st-started)}.cp-dot.review{background:var(--st-review)}.cp-dot.done{background:var(--st-done)}.cp-dot.backlog{background:var(--st-backlog)}

.cl-row{flex-wrap:wrap}.cl-acts{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}

/* ── polish from the UI/UX + naive-client reviews ── */
.ill-wrap{color:var(--mute);line-height:0}

.av .b{font:600 9px/1 var(--ui);letter-spacing:.02em}

.brand svg,.wordmark,.cp-brand{color:var(--accent-ink,#2A44B0)}

:root[data-theme="dark"] .brand svg,:root[data-theme="dark"] .wordmark,:root[data-theme="dark"] .cp-brand{color:#8FA3FF}

.pw-eye:focus-visible{outline:2px solid var(--accent)}

/* ── Arabic: font and right-to-left ── */

:root[lang="ar"] body{letter-spacing:0}
[dir="rtl"] .ico-back svg,[dir="rtl"] .ico-send svg,[dir="rtl"] .ico-reply svg{transform:scaleX(-1)}
[dir="rtl"] .wordmark,[dir="rtl"] .wm-anim,[dir="rtl"] .plate,[dir="rtl"] kbd,[dir="rtl"] .chip-task,[dir="rtl"] input[type="email"],[dir="rtl"] input[type="url"]{direction:ltr;unicode-bidi:isolate}

[dir="rtl"] .navi .t,[dir="rtl"] .side b,[dir="rtl"] .prow .nm,[dir="rtl"] .chi .t,[dir="rtl"] .chi b{unicode-bidi:plaintext}

[dir="rtl"] .toolbar{-webkit-mask-image:none;mask-image:none}

.md p,.md li,.md h1,.md h2,.md h3,.md h4,.md blockquote,.ev .txt p{unicode-bidi:plaintext}
/* owner dashboard */
.owner .ow-row .bar-main{width:100%}
.ow-cols{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}

.ow-listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.ow-team-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;padding:12px 2px;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.ow-name{display:flex;flex-direction:column;min-width:0}.ow-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ow-nums{display:flex;gap:10px;color:var(--fg2);font-variant-numeric:tabular-nums}
.ow-health{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.ow-health.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.ow-health.new{background:var(--accent-soft);color:var(--accent)}.ow-health.quiet{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}.ow-health.gone{background:var(--sunk);color:var(--mute)}
.ow-team-b{display:flex;flex-direction:column;gap:12px;padding:4px 2px 16px}

.older-wrap{display:flex;justify-content:center;padding:8px 0 4px}

/* weekly report: reads like a document on screen and prints cleanly as a PDF */
.report-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px var(--gr) 10px var(--gl);border-bottom:1px solid var(--line)}

.rp-cap{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}

.rp-foot{font-size:11.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}

}

.rp-capgroups{display:flex;flex-direction:column;gap:8px}

  }
}

addEventListener('offline', () => { S.online = false; renderPill(); });

/* ── task mutations (optimistic) ── */
function applyLocal(t) {
  const prevTurn = t.turn_owner;
  t.turn_owner = computeTurn(t);
  if (t.turn_owner !== prevTurn) t.turn_since = nowIso();
  t.updated_at = nowIso();
}
async function patchTask(id, patch, opts = {}) {
  const t = taskOf(id); if (!t) return;
  if (reviewLocked(t)) { toast(lockText(t)); return false; }
  const prev = {}; for (const k in patch) prev[k] = clone(t[k] ?? null);
  Object.assign(t, clone(patch)); applyLocal(t); refresh();
  const r = await write({ t: 'tasks', op: 'update', id, patch });
  if (r.error) { Object.assign(t, prev); applyLocal(t); refresh(); toast(errText(r.error)); return false; }
  if (r.data && r.data[0]) Object.assign(t, r.data[0]);
  refresh(); snapshot();
  if (opts.toast) toast(opts.toast, opts.noUndo ? null : { label: 'Undo', fn: () => patchTask(id, prev) });
  return true;
}
/* software teams talk about developers and sprints; agencies and other teams just have an owner */
function softwareTeam() { return !['agency', 'general'].includes(S.ws?.template); }
function devWord() { return softwareTeam() ? ', developer ' : ', assigned to '; }
function usesSprints() { return softwareTeam(); }
async function createTask(row, opts = {}) {
  row = Object.assign({ id: uuid(), workspace_id: S.ws.id, title: '', description: '', priority: 0, flags: [], fields: {}, checklist: [], gate_checks: [], created_by: uid(), created_at: nowIso(), updated_at: nowIso(), sendbacks: 0 }, row);
  if (!row.status_id) row.status_id = tyOf(row.type_id)?.default_status || defaultStatus()?.id;
  if (!row.reviewer_id) row.reviewer_id = S.ws.default_reviewer || null;
  if (!row.assignee_id) { const r = routeFor(row); if (r) row.assignee_id = r.user; }
  if (!row.assignee_id && S.members.length === 1) row.assignee_id = uid(); // a team of one: it's your turn, not nobody's
  const local = Object.assign({ number: null }, clone(row)); applyLocal(local); local.turn_since = nowIso();
  S.tasks.push(local); refresh();
  const r = await write({ t: 'tasks', op: 'insert', row });
  if (r.error) { S.tasks = S.tasks.filter(x => x.id !== row.id); refresh(); toast(errText(r.error)); return null; }
  if (r.data) Object.assign(local, r.data);
  refresh(); snapshot();
  if (opts.cleanFranco && looksFranco(row.title + ' ' + (row.description || ''))) cleanFranco(local).catch(() => {});
  return local;
}
async function deleteTask(id) {
  const t = taskOf(id); if (!t) return;
  if (reviewLocked(t)) { toast(lockText(t)); return false; }
  S.tasks = S.tasks.filter(x => x.id !== id); refresh();
  const r = await write({ t: 'tasks', op: 'delete', id });
  if (r.error) { S.tasks.push(t); refresh(); toast(errText(r.error)); return false; }
  toast(`${taskKey(t)} deleted`); return true;
}
async function addComment(taskId, body, mentions = [], meta = {}) {
  const row = { id: uuid(), task_id: taskId, author_id: uid(), body, mentions, created_at: nowIso() };
  const r = await write({ t: 'comments', op: 'insert', row });
  if (r.error) { toast(errText(r.error)); return null; }
  return row;
}
async function savePrefs(patch) {
  Object.assign(S.prefs, patch); applyTheme();
  await write({ t: 'prefs', op: 'upsert', row: Object.assign({}, S.prefs) });
}
async function saveWs(patch, msg) {
  const prev = {}; for (const k in patch) prev[k] = S.ws[k];
  Object.assign(S.ws, patch); applyTheme(); refresh();
  const r = await write({ t: 'workspaces', op: 'update', id: S.ws.id, patch });
  if (r.error) { Object.assign(S.ws, prev); applyTheme(); refresh(); toast(errText(r.error)); return false; }
  if (msg) toast(msg); return true;
}
/* generic config writes (statuses, types, fields, rules, projects, views) */
async function cfgUpsert(table, row, msg) {
  const list = S[LOCAL[table]]; const i = list.findIndex(x => x.id === row.id);
  const prev = i >= 0 ? clone(list[i]) : null;
  if (i >= 0) list[i] = Object.assign(list[i], row); else list.push(row);
  refresh();
  const r = await write(i >= 0 ? { t: table, op: 'update', id: row.id, patch: strip(row) } : { t: table, op: 'insert', row });
  if (r.error) { if (prev) Object.assign(list[i], prev); else list.splice(list.indexOf(row), 1); refresh(); toast(errText(r.error)); return false; }
  if (msg) toast(msg); snapshot(); return true;
}
function strip(row) { const o = Object.assign({}, row); delete o.id; return o; }
async function cfgDelete(table, id, msg) {
  const list = S[LOCAL[table]]; const i = list.findIndex(x => x.id === id); if (i < 0) return;
  const [prev] = list.splice(i, 1); refresh();
  const r = await write({ t: table, op: 'delete', id });
  if (r.error) { list.splice(i, 0, prev); refresh(); toast(errText(r.error)); return false; }
  if (msg) toast(msg); snapshot(); return true;
}

function clientSummary(tasks) {
  const cf = clientField(); const by = {};

  const out = [`*${S.ws.name} · status update · ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}*`, ''];
  for (const [k, list] of Object.entries(by)) {
    const done = list.filter(t => catOf(t) === 'done'); const rev = list.filter(t => catOf(t) === 'review'); const prog = list.filter(t => catOf(t) === 'started'); const wait = list.filter(t => t.turn_owner === 'client');
    const plan = list.filter(t => catOf(t) === 'unstarted' && t.turn_owner !== 'client');
    out.push(`*${k}*: ${done.length} done, ${rev.length} in review, ${prog.length} in progress, ${plan.length} planned${wait.length ? `, ${wait.length} waiting on you` : ''}`);
    for (const t of [...done.slice(0, 5)]) out.push(`✓ ${t.title}`);
    for (const t of rev.concat(prog).slice(0, 6)) out.push(`• ${t.title} (${stOf(t.status_id)?.name})`);

  for (const t of WS_TABLES) channel.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: `workspace_id=eq.${ws}` }, () => reload(t, () => loadTable(t)));
  channel.on('postgres_changes', { event: '*', schema: 'public', table: 'workspace_members', filter: `workspace_id=eq.${ws}` }, () => reload('m', loadMembers));

function wordDiff(a, b) {
  const A = String(a ?? '').split(/(\s+)/), B = String(b ?? '').split(/(\s+)/);

  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);

  while (i < A.length) push('del', A[i++]); while (j < B.length) push('ins', B[j++]);

}

    const r = p.new || p.old; if (!r) return;
    S.reactions = S.reactions.filter(x => !(x.message_id === r.message_id && x.user_id === r.user_id && x.emoji === r.emoji));

il updates":"تحديثات البريد","Same events by email, if your workspace has email sending set up.":"نفس الأحداث عبر البريد، إذا كان إرسال البريد مُعدًّا في مساحة العمل.","Data saver on":"توفير البيانات مفعّل","Data saver off":"توفير البيانات متوقف","Data saver":"توفير البيانات","No photos, no live updates. The app refreshes when you come back to it.":"بدون صور وبدون تحديثات مباشرة. يتحدّث التطبيق عند عودتك إليه.","Sounds":"الأصوات","New password":"كلمة مرور جديدة","Account":"الحساب","Use at least 6 characters":"استخدم 6 أحرف على الأقل","Saving…":"جارٍ الحفظ…","Password changed":"تم تغيير كلمة المرور","Change password":"تغيير كلمة المرور","Uploading photo…":"جارٍ رفع الصورة…","Photo updated":"تم تحديث الصورة","✓ Seen":"✓ تمت المشاهدة","Skipped":"تم التخطي","Not seen":"لم تُشاهَد","Replay":"إعادة التشغيل","Tours":"الجولات","Show tours":"إظهار الجولات","A short tour the first time you open each feature.":"جولة قصيرة أول مرة تفتح فيها كل ميزة.","Tours reset":"تمت إعادة ضبط الجولات","Reset all tours":"إعادة ضبط كل الجولات","Shortcuts":"الاختصارات","Search, jump or create":"ابحث أو انتقل أو أنشئ","Search this view":"البحث في هذا العرض","Next / previous in Review":"التالي / السابق في المراجعة","Pass / Send back":"اعتماد / إرجاع","Every open task is someone’s turn: the developer while it’s being built, the reviewer while it’s in review, the client while you wait on them. “My turn” shows only what’s yours. When your part is done, pass it on with the button on each task (over to you) and add a note so the next person has the context.":"كل مهمة مفتوحة هي في دور شخص ما: المطوّر أثناء التنفيذ، والمراجِع أثناء المراجعة، والعميل حين تنتظر ردّه. «دوري» يعرض ما يخصّك فقط. عندما تنتهي من جزئك، سلّمها بالزر الموجود في كل مهمة (over to you) وأضف ملاحظة ليعرف الشخص التالي السياق.","Team or company name":"اسم الفريق أو الشركة","ID prefix, e.g. ACME":"بادئة المعرّف، مثلًا ACME","Software team (Feature, Bug, Improvement, Chore)":"فريق برمجيات (ميزة، باج، تحسين، مهمة روتينية)","SSS setup (plu  (نفس الدالة التي ترسل التنبيهات).","no answer. Check that the notify function is deployed.":"لا يوجد رد. تأكد من نشر دالة notify.","Format":"الصيغة","CSV (Excel)":"CSV (إكسل)","Client summary":"ملخص للعميل","JSON includes every field, the checklist and comments, ready to import into other tools.":"ملف JSON يشمل كل الحقول وقائمة التحقق والتعليقات، جاهز للاستيراد في أدوات أخرى.","Basic":"أساسي","All fields":"كل الحقول","Client report":"تقرير العميل","Add the last comment":"إضافة آخر تعليق","Add developer email":"إضافة بريد المطوّر","Add task link":"إضافة رابط المهمة","Exporting…":"جارٍ التصدير…","Summary copied":"تم نسخ الملخص","Developer email":"بريد المطوّر","Last comment":"آخر تعليق","Link":"الرابط","No client":"بدون عميل","Preparing backup…":"جارٍ تجهيز النسخة الاحتياطية…","This is your desk.":"هذا مكتبك.","Only tasks where it’s your turn.":"المهام التي حان دورك فيها فقط.","Ring and days.":"الحلقة والأيام.","The ring shows whose turn it is; the number shows how long they’ve had it.":"الحلقة توضّح دور مَن، والرقم يوضّح منذ متى.","Waiting on others.":"في انتظار الآخرين.","Tasks you passed on wait here until they come back.":"المهام التي سلّمتها تنتظر هنا حتى تعود إليك.","Columns are statuses.":"الأعمدة هي الحالات.","Your admin sets their names, colors and order.":"الأدمن يحدّد أسماءها وألوانها وترتيبها.","Move a card.":"حرّك بطاقة.","Drag it on desktop. On the phone, press and hold.":"اسحبها على الكمبيوتر. على الموبايل، اضغط مطوّلًا.","Change the view.":"غيّر العرض.","Tap the title to switch views, projects or sprints.":"اضغط على العنوان للتبديل بين العروض أو المشاريع أو السبرنتات.","Filter, group, sort.":"فلتر، جمّع، رتّب.","Shape the list any way you like, then save it as a view.":"شكّل القائمة كما تحب، ثم احفظها كعرض.","Pick a type.":"اختر نوعًا.","Bugs and development work stay separate.":"الباجات وأعمال التطوير تبقى منفصلة.","Type shortcuts.":"اكتب الاختصارات.","@karim sets the developer, !high the priority, #mg the client.":"‎@karim يحدّد المطوّر، و‎!high الأ  يحتاج قائمة التحقق.","Tick every check before it can pass.":"حدّد كل البنود قبل الاعتماد.","Grouped by task.":"مجمّعة حسب المهمة.","One row per task, showing the latest reason.":"صف واحد لكل مهمة، يعرض آخر سبب.","Only what needs you buzzes.":"لا ينبّهك إلا ما يحتاجك.","Your turn and mentions notify you; the rest wait here.":"دورك والإشارات إليك تنبّهك، والباقي ينتظر هنا.","Swipe to clear.":"اسحب للمسح.","Right marks it done, left snoozes it. On desktop, right-click.":"لليمين لتعليمها كمنتهية، ولليسار لتأجيلها. على الكمبيوتر، استخدم النقر بالزر الأيمن.","Triage first.":"الفرز أولًا.","New bugs wait here until someone starts them.":"الباجات الجديدة تنتظر هنا حتى يبدأ أحد العمل عليها.","Regressions stand out.":"المشاكل العائدة واضحة.","Bugs that came back after Done get a red edge.":"الباجات التي عادت بعد إنجازها تظهر بحافة حمراء.","Your workflow.":"سير عملك.","Rename, recolor or reorder statuses.":"أعد تسمية الحالات أو تلوينها أو ترتيبها.","Types and fields.":"الأنواع والحقول.","Each type brings its own sections. Add Client, Area, Tier, or anything you track.":"لكل نوع أقسامه الخاصة. أضف العميل أو الموديول أو المستوى أو أي شيء تتابعه.","Routing and owners.":"التوجيه والمسؤولون.","Decide who gets new bugs and who reviews.":"حدّد مَن يستلم الباجات الجديدة ومَن يراجع.","Start from the template.":"ابدأ من القالب.","It already has your types, fields and team. Only Title is required.":"يحتوي بالفعل على أنواعك وحقولك وفريقك. العنوان فقط هو المطلوب.","Upload it back.":"ارفعه مرة أخرى.","Typos, nicknames and odd dates are fine. You review every fix before anything is created.":"الأخطاء الإملائية والأسماء المختصرة والتواريخ الغريبة لا مشكلة فيها. تراجع كل تصحيح قبل إنشاء أي شيء.","Pick a format.":"اختر صيغة.","CSV opens in Excel. The client summary is ready for WhatsApp or email.":"ملف CSV يفتح في إكسل. ملخص العميل جاهز لواتساب أو البريد.","Pick the columns.":"اختر الأعمدة.","Start from a preset, then add any field.":"ابدأ من إعداد جاهز، ثم أضف أي حقل.","Command bar":"شريط الأوامر","Anything, from here.":"أي شيء، من هنا.","Search tasks, jump to a view, or create. C creates, / searches.":"ابحث في المهام، أو انتقل إلى عرض، أو أنشئ. C للإنشاء، و/ للبحث.","Tour":"جولة","Tours turned off":"تم إيقاف الجولات","Turn off tours":"إيقاف الجولات","Got it":"فهمت","Next":"التالي","Search tasks, jump to a view, or type a command…":"ابحث في المهام، أو انتقل إلى عرض، أو اكتب أمرًا…","Report a bug":"الإبلاغ عن باج","Go to My turn":"الانتقال إلى دوري","Open notifications":"فتح الإشعارات","Go to Review":"الانتقال إلى المراجعة","Go to Work":"الانتقال إلى العمل","Go to Bugs":"الانتقال إلى الباجات","Go to Sprint":"الانتقال إلى السبرنت","Go to Clients":"الانتقال إلى العملاء","Go to All tasks":"الانتقال إلى كل المهام","View: ":"عرض: ","Project: ":"المشروع: ","Open chat":"فتح المحادثات","New message to…":"رسالة جديدة إلى…","New channel…":"قناة جديدة…","Import tasks from a file…":"استيراد مهام من ملف…","Download the import template":"تنزيل قالب الاستيراد","Export…":"تصدير…","Switch theme":"تبديل السمة","Actions":"الإجراءات","Get an alert when it’s your turn?":"هل تريد تنبيهًا عندما يحين دورك؟","Turn on":"تفعيل","This browser can’t show alerts. On iPhone, add the app to your home screen first.":"هذا المتصفح لا يدعم التنبيهات. على الآيفون، أضف التطبيق إلى الشاشة الرئيسية أولًا.","Alerts stay off. You can allow them in your browser settings.":"التنبيهات ستبقى متوقفة. يمكنك السماح بها من إعدادات المتصفح.","Alerts are on for this device":"التنبيهات مفعّلة على هذا الجهاز","Couldn’t turn on alerts: ":"تعذّر تفعيل التنبيهات: ","Loading your tasks…":"جارٍ تحميل مهامك…","Your full name":"اسمك الكامل","Choose a password (6+ characters)":"اختر كلمة مرور (6 أحرف أو أكثر)","Password":"كلمة المرور","Sign in":"تسجيل الدخول","Take my seat":"انضم للفريق","Send reset link":"إرسال رابط إعادة التعيين","Welcome to the team":"أهلًا بك في الفريق","Create your account":"أنشئ حسابك","Reset password":"إعادة تعيين كلمة المرور","Sign in to see whose turn it is.":"سجّل الدخول لتعرف دور مَن."," , actual))":" (فيه تفاصيل باج (خطوات، متوقَّع، فعلي))"," (it reads like a bug)":" (يبدو كباج)"," (default type)":" (النوع الافتراضي)"," (matched to a priority)":" (طوبق مع أولوية)"," (matched to a teammate)":" (طوبق مع زميل)"," (read as a date)":" (قُرئ كتاريخ)"," (matched to a project)":" (طوبق مع مشروع)"," (matched to a status)":" (طوبق مع حالة)"," (matched to an option)":" (طوبق مع خيار)"," (spelling and grammar)":" (الإملاء والقواعد)"," (AI suggestion)":" (اقتراح الذكاء الاصطناعي)"," (AI)":" (الذكاء الاصطناعي)","Title: ":"العنوان: ","Description: ":"الوصف: ","Type: ":"النوع: ","Priority: ":"الأولوية: ","Developer: ":"المطوّر: ","Reviewer: ":"المراجِع: ","Due date: ":"تاريخ التسليم: ","Status: ":"الحالة: ","The free spelling service is busy. Try again in a minute, or carry on without it.":"خدمة التدقيق الإملائي المجانية مشغولة. حاول بعد دقيقة، أو تابع بدونها.","The spelling service couldn’t be reached, so only the offline fixes were made.":"تعذّر الوصول لخدمة التدقيق الإملائي، لذلك طُبّقت التصحيحات المحلية فقط.","AI didn’t answer.":"لم يردّ الذكاء الاصطناعي.","AI":"الذكاء الاصطناعي","AI suggestion":"اقتراح الذكاء الاصطناعي","Title *":"العنوان *","Required. One line: what needs doing or what is broken.":"مطلوب. سطر واحد: ما المطلوب أو ما المعطّل.","Optional. What is needed or what happened. Write it however you like; Ovrto tidies the spelling.":"اختياري. ما المطلوب أو ما الذي حدث. اكتبه كما تحب، وسيصحّح Ovrto الإملاء.","Optional. Urgent, High, Medium or Low. Words like asap or minor also work.":"اختياري. Urgent أو High أو Medium أو Low. كلمات مثل asap أو minor تعمل أيضًا.","People":"الأشخاص","Optional. Who will do it: a name, first name or email. Leave it empty and bugs go to their usual developer.":"اختياري. مَن سينفّذها: اسم أو اسم أول أو بريد. اتركه فارغًا وستذهب الباجات لمطوّرها المعتاد.","Optional. Who checks it. Leave it empty for the workspace default.":"اختياري. مَن يراجعها. اتركه فارغًا لاستخدام الافتراضي لمساحة العمل.","Optional. Any format: 30/11/2026,
