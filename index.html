/* SSS Tasks — sticky toolbar over a horizontally scrolling board; details slide in from the right */

  --accent:#7d9bff;--accent-soft:#1f2a48;--on-accent:#0d1222;
  --amber:#e0a93a;--green:#4cc285;--red:#ee6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}

.comment .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.cbox{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cbox textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:9px 11px;resize:vertical}
.cbox .act{display:flex;justify-content:flex-end}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow .nm{flex:1 1 160px;min-width:0;font-weight:500;overflow-wrap:anywhere}
.mrow .sub{color:var(--mute);font-size:12px;font-weight:400}

.inlinename:hover,.inlinename:focus{border-color:var(--line)!important;background:var(--bg)!important}
.dot{width:16px;height:16px;border-radius:50%;border:0;flex:none;padding:0}
.addbox{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.addbox p{margin:0}
.inline{display:flex;gap:8px;flex-wrap:wrap}.inline input{flex:1 1 180px;min-width:0}
.center{min-height:100%;display:grid;place-items:center;padding:24px var(--gr) 24px var(--gl)}
.authcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.authcard h1{margin:6px 0 0;font-size:22px;letter-spacing:-.02em}.authcard p{margin:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.field input{padding:9px 11px;font-size:14px}
.err{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px}
.info{background:var(--accent-soft);color:var(--fg);padding:9px 12px;border-radius:8px;font-size:13px}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
@media (max-width:640px){.board{scroll-snap-type:x mandatory}.col{scroll-snap-align:start;flex-basis:84vw}.props{grid-template-columns:88px 1fr}.lrow .id,.lrow .ptag{display:none}.row1 .btn:not(.primary){padding:6px 9px}}
</style>

<script>

   Supabase → Project Settings → API → "Project URL" and "anon public" key */

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwaWN0ZHpjdGpnYnNjdG9iZWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzk1NTIsImV4cCI6MjEwODYxNTU1Mn0.AOFai2W36-RmzBX7-4BCq-B9B7a4N5mXB3p0ziAUveE';
/* ════════════════════════════════════════════════════════════════════ */

(() => {
const KEY='SSS';
const STATUSES=[{k:'backlog',n:'Backlog'},{k:'todo',n:'Todo'},{k:'progress',n:'In Progress'},{k:'review',n:'In Review'},{k:'done',n:'Done'},{k:'canceled',n:'Canceled'}];
const PRIOS=[{k:1,n:'Urgent'},{k:2,n:'High'},{k:3,n:'Medium'},{k:4,n:'Low'},{k:0,n:'No priority'}];

const TABLES=['profiles','projects','tasks','invites'];
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k==='value')e.value=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const store={get(k,d){try{const v=localStorage.getItem('sss.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('sss.'+k,JSON.stringify(v))}catch{}}};

/* ---------- helpers ---------- */
const me=()=>session&&S.profiles.find(p=>p.id===session.user.id);
const isAdmin=()=>me()?.role==='admin';
const prof=id=>id?S.profiles.find(p=>p.id===id):null;
const proj=id=>id?S.projects.find(p=>p.id===id):null;

const initials=p=>dname(p).split(/[\s._-]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const sName=k=>STATUSES.find(s=>s.k===k)?.n||k;

function errText(e){const m=e?.message||String(e);
  if(/not been invited|Database error saving new user/i.test(m))return 'This email has not been invited yet. Ask an admin to add it in Team & settings → Members.';
  if(/Invalid login credentials/i.test(m))return 'Email or password is incorrect.';
  if(/Email not confirmed/i.test(m))return 'Confirm your email first. Check your inbox for the link.';
  if(/row-level security|permission/i.test(m))return 'You don’t have permission to do that.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Can’t reach the server. Check your connection.';
  return m}
let toastT;function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=el('div',{class:'toast',role:'status',text:m});document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800)}
async function load(t){const o={profiles:['full_name',true],projects:['created_at',true],tasks:['number',false],invites:['created_at',true]}[t];
  const {data,error}=await sb.from(t).select('*').order(o[0],{ascending:o[1]});if(!error&&data)S[t]=data}
async function run(q,ok){const {data,error}=await q;if(error){toast(errText(error));return null}if(ok)toast(ok);await Promise.all(TABLES.map(load));refresh();return data??true}

/* ---------- icons ---------- */
function statusIcon(k,size=14){const c={backlog:'var(--mute)',todo:'var(--fg2)',progress:'var(--amber)',review:'var(--green)',done:'var(--accent)',canceled:'var(--mute)'}[k]||'var(--mute)';
  const i={backlog:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2 2.2"/>`,
    todo:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.5"/>`,
    progress:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.5"/><path d="M7 7V3.5A3.5 3.5 0 0 1 7 10.5Z" fill="${c}"/>`,

    canceled:`<circle cx="7" cy="7" r="6.2" fill="${c}"/><path d="M5 5l4 4M9 5l-4 4" stroke="var(--surface)" stroke-width="1.4" stroke-linecap="round"/>`}[k]||'';
  return el('span',{class:'ico',title:sName(k),html:`<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-hidden="true">${i}</svg>`})}
function prioIcon(p){let i;if(p===1)i=`<rect x="1" y="1" width="12" height="12" rx="3" fill="var(--red)"/><path d="M7 3.8v4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="10.1" r="1" fill="#fff"/>`;
  else if(!p)i=`<path d="M2.5 7h2M6 7h2M9.5 7h2" stroke="var(--mute)" stroke-width="1.5" stroke-linecap="round"/>`;
  else{const lv={2:3,3:2,4:1}[p];i=[0,1,2].map(n=>`<rect x="${2+n*3.6}" y="${9-n*2.6}" width="2.4" height="${3+n*2.6}" rx=".8" fill="${n<lv?'var(--fg2)':'var(--line-strong)'}"/>`).join('')}
  return el('span',{class:'ico',title:pName(p),html:`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${i}</svg>`})}
function avatar(p,size=20){if(!p)return el('span',{class:'av empty',title:'Unassigned',style:`width:${size}px;height:${size}px`});return el('span',{class:'av',title:dname(p),style:`width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px`,text:initials(p)})}
function projTag(id){const p=proj(id);return p?el('span',{class:'ptag'},el('i',{style:`background:${p.color}`}),p.name):null}

  box.replaceChildren(...(comments.length?comments.map(c=>{const a=prof(c.author_id);return el('div',{class:'comment'},avatar(a,24),el('div',{class:'b'},
    el('div',{class:'who'},dname(a),el('time',{text:new Date(c.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}),
      (c.author_id===m?.id||isAdmin())&&el('button',{class:'link small',onclick:async()=>{const {error}=await sb.from('comments').delete().eq('id',c.id);if(error)toast(errText(error));else{comments=comments.filter(x=>x.id!==c.id);drawComments()}}},'Delete')),
    el('div',{class:'txt',text:c.body})))}):[el('p',{class:'muted small',text:'No comments yet.'})]))}

/* ---------- team & settings ---------- */
function twoClick(btn,label,fn){let armed=false;const orig=btn.textContent;btn.addEventListener('click',()=>{if(armed){armed=false;fn()}else{armed=true;btn.textContent=label}});btn.addEventListener('blur',()=>{armed=false;btn.textContent=orig})}
function drawSettings(dr){const tab=overlay.tab;
  const tabs=el('div',{class:'seg',role:'tablist'},[['members','Members'],['projects','Projects'],['profile','My profile']].map(([k,n])=>el('button',{'aria-pressed':String(tab===k),onclick:()=>{overlay.tab=k;drawSettings(dr)}},n)));
  const body=el('div',{class:'dbody'});const m=me();
  if(tab==='members'){
    body.append(el('div',{class:'sec'},el('h3',{id:'memH'}),el('div',{id:'memList'})),el('div',{class:'sec',id:'invSec'},el('h3',{text:'Invited · waiting to sign up'}),el('div',{id:'invList'})));
    if(isAdmin()){const em=el('input',{type:'email',id:'inviteEmail',required:true,placeholder:'name@ssseg.com','aria-label':'Email to invite'});
      const role=el('select',{'aria-label':'Role'},el('option',{value:'member'},'Member'),el('option',{value:'admin'},'Admin'));
      const f=el('form',{class:'addbox'},el('h3',{text:'Invite a teammate'}),el('div',{class:'inline'},em,role,el('button',{class:'btn primary'},'Invite')),
        el('p',{class:'muted small',text:'Send them the app link. They tap “First time? Create an account” with this email, and they’re in.'}));
      f.addEventListener('submit',async e=>{e.preventDefault();const v=em.value.trim().toLowerCase();if(S.profiles.some(p=>p.email===v)){toast('That person is already a member.');return}
        if(await run(sb.from('invites').upsert({email:v,role:role.value,invited_by:m?.id}).select(),`Invited ${v}`))em.value=''});
      body.append(f)}else body.append(el('p',{class:'muted small',text:'Only admins can invite or remove members.'}))
  }else if(tab==='projects'){
    const pi=el('input',{type:'text',id:'projName',placeholder:'e.g. Clubhouse membership','aria-label':'Project name'});
    const f=el('form',{class:'addbox'},el('h3',{text:'New project'}),el('div',{class:'inline'},pi,el('button',{class:'btn primary'},'Add project')));
    f.addEventListener('submit',async e=>{e.preventDefault();const n=pi.value.trim();if(!n)return;if(await run(sb.from('projects').insert({name:n,color:PCOLORS[S.projects.length%PCOLORS.length]}).select(),'Project added'))pi.value=''});
    body.append(el('div',{class:'sec'},el('h3',{id:'projH'}),el('div',{id:'projList'})),f)
  }else if(m){
    const nm=el('input',{type:'text',id:'myName','aria-label':'Display name',value:m.full_name||''});
    const f1=el('form',{class:'addbox'},el('h3',{text:'Display name'}),el('div',{class:'inline'},nm,el('button',{class:'btn primary'},'Save')),el('p',{class:'muted small',text:`${m.email} · ${m.role==='admin'?'Admin':'Member'}`}));
    f1.addEventListener('submit',e=>{e.preventDefault();run(sb.from('profiles').update({full_name:nm.value.trim()}).eq('id',m.id).select(),'Name updated')});
    const pw=el('input',{type:'password',id:'newPw',minlength:'6','aria-label':'New password',placeholder:'New password',autocomplete:'new-password'});
    const f2=el('form',{class:'addbox'},el('h3',{text:'Change password'}),el('div',{class:'inline'},pw,el('button',{class:'btn'},'Update')));
    f2.addEventListener('submit',async e=>{e.preventDefault();if(pw.value.length<6){toast('Use at least 6 characters');return}const {error}=await sb.auth.updateUser({password:pw.value});if(error)toast(errText(error));else{toast('Password changed');pw.value=''}});
    body.append(f1,f2,el('button',{class:'btn',onclick:()=>sb.auth.signOut()},'Sign out'))}
  dr.replaceChildren(el('div',{class:'dhead'},tabs,el('span',{class:'spacer'}),el('button',{class:'iconbtn','aria-label':'Close',html:X,onclick:closeOverlay})),body);
  drawSettingsLists()}
function drawSettingsLists(){const m=me(),admin=isAdmin();
  const ml=$('#memList');
  if(ml){$('#memH').textContent=`Members · ${S.profiles.length}`;
    ml.replaceChildren(...S.profiles.map(p=>{const open=S.tasks.filter(t=>t.assignee_id===p.id&&t.status!=='done'&&t.status!=='canceled').length,done=S.tasks.filter(t=>t.assignee_id===p.id&&t.status==='done').length;
      let roleEl;if(admin&&p.id!==m?.id){roleEl=el('select',{'aria-label':'Role for '+dname(p),onchange:e=>run(sb.from('profiles').update({role:e.target.value}).eq('id',p.id).select(),'Role updated')},
          el('option',{value:'member',selected:p.role==='member'},'Member'),el('option',{value:'admin',selected:p.role==='admin'},'Admin'))}
      else roleEl=el('span',{class:'badge',text:p.role==='admin'?'Admin':'Member'});
      let rm=null;if(admin&&p.id!==m?.id){rm=el('button',{class:'btn ghost danger'},'Remove');twoClick(rm,'Confirm',()=>run(sb.from('profiles').delete().eq('id',p.id).select(),'Member removed'))}
      return el('div',{class:'mrow'},avatar(p,30),el('div',{class:'nm'},el('div',{},dname(p),p.id===m?.id&&el('span',{class:'muted',text:' (you)'})),
        el('div',{class:'sub'},p.email+' · ',el('span',{class:'mono',text:`${open} open · ${done} done`}))),roleEl,
        el('button',{class:'btn ghost',onclick:()=>{U.person=p.id;U.mine=false;closeOverlay();refresh()}},'Tasks'),rm)}));
    const inv=$('#invList'),sec=$('#invSec');sec.hidden=!(admin&&S.invites.length);
    inv.replaceChildren(...S.invites.map(i=>el('div',{class:'mrow'},el('span',{class:'av empty',style:'width:30px;height:30px'}),
      el('div',{class:'nm'},el('div',{text:i.email}),el('div',{class:'sub',text:`${i.role==='admin'?'Admin':'Member'} · invited ${new Date(i.created_at).toLocaleDateString()}`})),
      el('button',{class:'btn ghost danger',onclick:()=>run(sb.from('invites').delete().eq('email',i.email).select(),'Invite cancelled')},'Cancel invite'))))}
  const pl=$('#projList');
  if(pl){$('#projH').textContent=`Projects · ${S.projects.length}`;
    pl.replaceChildren(...(S.projects.length?S.projects.map(p=>{
      const nm=el('input',{type:'text',class:'inlinename','aria-label':'Project name',value:p.name});
      nm.addEventListener('blur',()=>{const v=nm.value.trim();if(v&&v!==p.name)run(sb.from('projects').update({name:v}).eq('id',p.id).select())});
      const del=el('button',{class:'btn ghost danger'},'Delete');twoClick(del,'Confirm',()=>run(sb.from('projects').delete().eq('id',p.id).select(),'Project deleted'));
      return el('div',{class:'mrow'},el('button',{class:'dot',style:`background:${p.color}`,title:'Change color','aria-label':'Change color',
        onclick:()=>run(sb.from('projects').update({color:PCOLORS[(PCOLORS.indexOf(p.color)+1)%PCOLORS.length]}).eq('id',p.id).select())}),
        nm,el('span',{class:'sub mono',text:`${S.tasks.filter(t=>t.project_id===p.id).length} tasks`}),del)})
      :[el('p',{class:'muted small',text:'No projects yet. Add one to group related tasks.'})]))}
}

/* ---------- boot ---------- */
async function start(){
  if(!session){if(channel){sb.removeChannel(channel);channel=null}closeOverlay();authScreen('in');return}
  if(recovery){recoveryScreen();return}
  if(!shellBuilt)buildShell();
  S.loading=true;refresh();
  await Promise.all(TABLES.map(load));S.loading=false;refresh();
  if(!channel){const timers={};channel=sb.channel('workspace');
    for(const t of TABLES)channel.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(timers[t]);timers[t]=setTimeout(async()=>{await load(t);refresh()},150)});
    channel.subscribe()}
}
if(!configured){setupScreen();return}
let booted=false;
sb.auth.onAuthStateChange((event,s)=>{const prev=session?.user?.id;session=s;
  // Defer: calling Supabase from inside this callback can stall the auth client.
  setTimeout(()=>{if(event==='PASSWORD_RECOVERY'){recovery=true;start();return}
    if(!booted||prev!==s?.user?.id||event==='SIGNED_OUT'){booted=true;start()}},0)});
})();
</script>
